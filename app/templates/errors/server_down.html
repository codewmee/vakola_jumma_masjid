{% extends "base.html" %}
{% block title %}We'll be right back{% endblock %}
{% block content %}
<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #eef1ea 0%, #dfe6d6 45%, #cdd8c0 100%);
  }

  .error-page::before,
  .error-page::after {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,89,0.18) 0%, rgba(212,175,89,0) 70%);
    pointer-events: none;
  }
  .error-page::before { top: -180px; left: -160px; }
  .error-page::after { bottom: -200px; right: -160px; }

  .error-card {
    position: relative;
    z-index: 1;
    max-width: 480px;
    animation: rise 0.7s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .error-arabic {
    font-family: 'Scheherazade New', serif;
    font-size: 3.25rem;
    line-height: 1.4;
    color: #b9902f;
    margin: 0 0 0.75rem;
    text-shadow: 0 2px 12px rgba(185,144,47,0.25);
  }

  .error-code {
    font-family: 'Cinzel Decorative', 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: 0.35em;
    color: #8a7a4a;
    margin: 0 0 1rem;
  }

  .error-title {
    font-family: 'Cinzel', serif;
    font-size: 1.75rem;
    color: #475441;
    margin: 0 0 0.75rem;
  }

  .error-sub {
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    color: #7c8873;
    margin: 0 0 2.5rem;
    line-height: 1.6;
  }

  .error-divider {
    width: 64px;
    height: 2px;
    margin: 0 auto 2.5rem;
    background: linear-gradient(90deg, transparent, #d4af59, transparent);
  }

  .error-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #fff;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 2.25rem;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(71,84,65,0.9), rgba(110,129,101,0.85));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 8px 24px rgba(71,84,65,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
  }

  .error-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(71,84,65,0.32), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .error-btn svg { width: 14px; height: 14px; }

  .server-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 1rem;
    color: #8a7a4a;
    opacity: 0.85;
  }

  @media (max-width: 480px) {
    .error-arabic { font-size: 2.5rem; }
    .error-title { font-size: 1.4rem; }
  }
</style>

<div class="error-page">
  <div class="error-card">
    <svg class="server-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="7" rx="1.5"/>
      <rect x="2" y="14" width="20" height="7" rx="1.5"/>
      <line x1="6" y1="6.5" x2="6.01" y2="6.5"/>
      <line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
    </svg>
    <p class="error-arabic">قيد الصيانة</p>
    <p class="error-code">SERVER DOWN</p>
    <h1 class="error-title">We'll be right back</h1>
    <p class="error-sub">{{ message or "Our server is temporarily unavailable. Please try again shortly." }}</p>
    <div class="error-divider"></div>
    <a href="javascript:location.reload()" class="error-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      Retry
    </a>
  </div>
</div>
{% endblock %}
