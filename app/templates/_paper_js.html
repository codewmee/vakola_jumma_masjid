<script>
/* NikahPaper.render(data) -> HTML string. NikahPaper.fit(root) -> shrink-to-fit pass.
   Every coordinate is in design px on a 1024x1536 canvas (F(x, y, w, h, ...)).
   Layout was measured against full_border.png: header inside the arch, all section
   frames inset to x=100..924 to clear the arch flare, closing row clear of the bottom corners.
   The border/corners/lanterns/arch/mosque silhouette all live in full_border.png
   (rendered by .nk-static in _paper_css.html) — this file only lays out live text/fields. */
window.NikahPaper = (function () {
  'use strict';

  var W = 1024, H = 1536;
  var UD = '۰۱۲۳۴۵۶۷۸۹';
  var MONTHS = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  var DAYS = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];

  function txt(v) { return (v === null || v === undefined) ? '' : String(v); }
  function esc(v) {
    return txt(v).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function ud(v) { return txt(v).replace(/[0-9]/g, function (g) { return UD.charAt(parseInt(g, 10)); }); }
  function parseDay(iso) {
    var s = txt(iso).trim(); if (!s) return null;
    var d = new Date(s.slice(0, 10) + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  function timeBoth(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(txt(t).trim());
    if (!m) return { en: '', ur: '' };
    var h = parseInt(m[1], 10), h12 = (h % 12 === 0) ? 12 : (h % 12);
    var part = h < 12 ? 'صبح' : (h < 17 ? 'دوپہر' : 'شام');
    return { en: h12 + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'), ur: ud(h12 + ':' + m[2]) + ' ' + part };
  }
  function pc(n, total) { return (n / total * 100).toFixed(3); }

  // absolutely-positioned box in design px. fs = starting font size (design px) for fit().
  function F(x, y, w, h, inner, cls, fs) {
    return '<div class="nk-f ' + (cls || '') + '"' + (fs ? ' data-fs="' + fs + '"' : '') +
      ' style="left:' + pc(x, W) + '%;top:' + pc(y, H) + '%;width:' + pc(w, W) + '%;height:' + pc(h, H) + '%' +
      (fs ? ';--fs:' + fs : '') + '">' + inner + '</div>';
  }
  function sec(x, y, w, h, cls) { return F(x, y, w, h, '', 'nk-sec ' + (cls || '')); }
  function vl(x, y, h) { return F(x, y, 0, h, '', 'nk-vl'); }
  function label(x, y, w, en, ur, cls) {
    return F(x, y, w, 16, '<span>' + en + '</span><span class="ur" lang="ur">' + ur + '</span>', 'nk-lbl ' + (cls || ''));
  }
  function val(x, y, w, h, en, ur, fs) {
    return F(x, y, w, h,
      '<b>' + esc(txt(en).trim()) + '</b><span class="ur" lang="ur">' + esc(txt(ur).trim()) + '</span>',
      'nk-vbox nk-fit', fs || 15);
  }
  function ck(on) { return '<span class="nk-ck' + (on ? ' on' : '') + '"></span>'; }
  function opt(x, y, w, on, en, ur) {
    return F(x, y, w, 24, ck(on) + '<span>' + en + '</span><span class="ur" lang="ur">' + ur + '</span>', 'nk-opt');
  }

  // ---------- header (inside the arch; mosque/arch/lanterns come from full_border.png) ----------
  function renderHeader() {
    return '' +
      F(262, 152, 500, 48, '<span lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span>', 'nk-bism') +
      F(160, 240, 190, 104,
        '<div class="ar" lang="ar">وَخَلَقْنَاكُمْ أَزْوَاجًا</div>' +
        '<div class="tr ur" lang="ur">اور ہم نے تمہیں جوڑوں میں پیدا کیا۔</div>' +
        '<div class="rf" lang="ar">(القرآن ۷۸:۸)</div>', 'nk-verse') +
      F(674, 240, 190, 104,
        '<div class="ar" lang="ar">لِّتَسْكُنُوٓا۟ إِلَيْهَا</div>' +
        '<div class="tr ur" lang="ur">تاکہ تم ان سے سکون حاصل کرو۔</div>' +
        '<div class="rf" lang="ar">(القرآن ۳۰:۲۱)</div>', 'nk-verse') +
      F(300, 206, 424, 100, '<span class="ur" lang="ur">نکاح نامہ</span>', 'nk-tur') +
      F(300, 304, 424, 42, 'NIKAH NAMA', 'nk-ten') +
      F(362, 352, 300, 16, '<i></i><span>❖</span><i></i>', 'nk-div') +
      F(300, 366, 424, 44, '<span class="ur" lang="ur">عقد نکاح</span>', 'nk-sur') +
      F(300, 410, 424, 24, 'Marriage Contract', 'nk-sen');
  }

  // ---------- date / location / serial ----------
  function renderTopInfo(d) {
    var y0 = 515;
    var dt = parseDay(d.nikah_date);
    var numDate = dt ? pad2(dt.getDate()) + '/' + pad2(dt.getMonth() + 1) + '/' + dt.getFullYear() : '';
    var urDate = dt ? ud(dt.getDate()) + ' ' + MONTHS[dt.getMonth()] + ' ' + ud(dt.getFullYear()) : '';
    var enDay = dt ? dt.toLocaleDateString('en-US', { weekday: 'long' }) : '';
    var urDay = dt ? DAYS[dt.getDay()] : '';
    var tm = timeBoth(d.nikah_time);
    var l2en = [enDay, tm.en].filter(Boolean).join(' · ');
    var l2ur = [urDay, tm.ur].filter(Boolean).join(' · ');
    var dateInner =
      '<div class="ln"><b>' + esc(numDate) + '</b><span class="ur" lang="ur">' + esc(urDate) + '</span></div>' +
      '<div class="ln sm"><span>' + esc(l2en) + '</span><span class="ur" lang="ur">' + esc(l2ur) + '</span></div>';
    var serEn = [d.jild_no ? 'Vol. ' + txt(d.jild_no) : '', d.sanad_no ? 'No. ' + txt(d.sanad_no) : ''].filter(Boolean).join(' / ');
    var serUr = [d.jild_no ? 'جلد ' + ud(d.jild_no) : '', d.sanad_no ? 'نمبر ' + ud(d.sanad_no) : ''].filter(Boolean).join(' / ');
    return '' +
      sec(100, y0, 824, 80) +
      label(116, y0 + 8, 270, 'Nikah Date', 'تاریخ نکاح') +
      F(116, y0 + 26, 270, 46, dateInner, 'nk-vbox col nk-fit', 15) +
      vl(398, y0 + 10, 60) +
      label(412, y0 + 8, 290, 'Nikah Location', 'نکاح کی جگہ') +
      val(412, y0 + 26, 290, 46, d.nikah_location, d.nikah_location_ur, 15) +
      vl(714, y0 + 10, 60) +
      label(728, y0 + 8, 180, 'Serial No.', 'سلسلہ نمبر') +
      val(728, y0 + 26, 180, 46, serEn, serUr, 15);
  }

  // ---------- groom / bride ----------
  function renderParty(y0, en, ur, nameUrLbl, p, d) {
    var age = d[p + '_age'];
    return '' +
      sec(100, y0, 824, 174) +
      F(118, y0 + 14, 114, 146,
        '<div class="nk-medal"><svg viewBox="0 0 100 140" preserveAspectRatio="none">' +
          '<path d="M50 4C58 18 78 20 92 28C88 45 94 60 94 70C94 80 88 95 92 112C78 120 58 122 50 136C42 122 22 120 8 112C12 95 6 80 6 70C6 60 12 45 8 28C22 20 42 18 50 4Z" fill="#fffdf5" stroke="#b8862f" stroke-width="2.2" vector-effect="non-scaling-stroke"/>' +
          '<path d="M50 11C56 22 72 24 85 31C82 46 87 60 87 70C87 80 82 94 85 109C72 116 56 118 50 129C44 118 28 116 15 109C18 94 13 80 13 70C13 60 18 46 15 31C28 24 44 22 50 11Z" fill="none" stroke="#b8862f" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '</svg><div class="tx"><span class="en">' + en + '</span><span class="ur" lang="ur">' + ur + '</span></div></div>') +
      vl(248, y0 + 14, 146) +
      label(264, y0 + 9, 644, 'Full Name of ' + en, nameUrLbl) +
      val(264, y0 + 26, 644, 30, d[p + '_name'], d[p + '_name_ur'], 16) +
      label(264, y0 + 63, 130, 'Age', 'عمر') +
      val(264, y0 + 80, 130, 30, age, age ? ud(age) : '', 15) +
      label(410, y0 + 63, 498, 'Address', 'پتہ') +
      val(410, y0 + 80, 498, 30, d[p + '_address'], d[p + '_address_ur'], 14.5) +
      label(264, y0 + 117, 644, "Father\u2019s Name", 'باپ کا نام') +
      val(264, y0 + 134, 644, 30, d[p + '_father_name'], d[p + '_father_name_ur'], 15);
  }

  // ---------- vakil / witnesses ----------
  function renderTrio(d) {
    var y0 = 979;
    function card(x, en, ur, p) {
      var age = d[p + '_age'], cx = x + 14, cw = 236;
      return '' +
        sec(x, y0, 264, 181, 'nk-sm') +
        F(cx, y0 + 6, cw, 24, '<span>' + en + '</span><span class="ur" lang="ur">' + ur + '</span>', 'nk-chead') +
        label(cx, y0 + 34, cw, 'Full Name', 'نام') +
        val(cx, y0 + 50, cw, 26, d[p + '_name'], d[p + '_name_ur'], 14) +
        label(cx, y0 + 81, cw, 'Age', 'عمر') +
        val(cx, y0 + 97, cw, 26, age, age ? ud(age) : '', 14) +
        label(cx, y0 + 128, cw, 'Address', 'پتہ') +
        val(cx, y0 + 144, cw, 26, d[p + '_address'], d[p + '_address_ur'], 13);
    }
    return card(100, 'Vakil', 'وکیل', 'vakil') +
           card(380, 'Witness 1', 'گواہ اول', 'witness1') +
           card(660, 'Witness 2', 'گواہ دوم', 'witness2');
  }

  // ---------- mahr ----------
  function renderMahr(d) {
    var y0 = 1172;
    var raw = txt(d.maher_amount).trim();
    var n = Number(raw.replace(/,/g, ''));
    var amount = raw === '' ? '' : (isFinite(n) ? n.toLocaleString('en-IN') : raw);
    var prompt = d.dower_type !== 'deferred';
    var paid = d.mahr_paid;
    var yes = paid === true || paid === 'yes' || paid === 'paid';
    var no = paid === false || paid === 'no';
    return '' +
      sec(100, y0, 824, 68) +
      label(116, y0 + 8, 224, 'Amount of Mahr', 'مہر کی رقم') +
      F(116, y0 + 26, 224, 32, '<b>' + (amount ? '\u20B9 ' + esc(amount) : '') + '</b>', 'nk-vbox nk-fit', 17) +
      vl(354, y0 + 10, 48) +
      opt(366, y0 + 22, 196, !prompt, 'Deferred Dower', 'مؤخر مہر') +
      opt(566, y0 + 22, 180, prompt, 'Prompt Dower', 'فوری مہر') +
      vl(752, y0 + 10, 48) +
      label(764, y0 + 8, 148, 'Mahr Paid', 'مہر ادا کردی گئی', 's') +
      opt(764, y0 + 34, 70, yes, 'Yes', 'ہاں') +
      opt(842, y0 + 34, 72, no, 'No', 'نہیں');
  }

  // ---------- stamp / qazi / signatures ----------
  function renderClosing(d) {
    var y0 = 1250;
    function sline(y, en, ur, html) {
      return F(340, y, 540, 24,
        '<div class="nk-sigrow"><span class="lb">' + en + ' <span class="ur" lang="ur">' + ur + '</span></span>' +
        '<span class="nk-sig">' + (html || '') + '</span></div>');
    }
    var q = txt(d.qazi_name).trim(), qu = txt(d.qazi_name_ur).trim();
    var qHtml = (q ? esc(q) : '') + (qu ? ' <span class="ur" lang="ur">' + esc(qu) + '</span>' : '');
    return '' +
      label(150, y0, 150, 'Stamp', 'مہر') +
      F(150, y0 + 20, 150, 66, d.stamp_url ? '<img src="' + esc(d.stamp_url) + '" alt="">' : '', 'nk-stamp') +
      vl(322, y0 + 2, 84) +
      sline(y0 + 6, 'Qazi / Nikah Registrar', 'قاضی / نکاح رجسٹرار', qHtml) +
      sline(y0 + 40, 'Groom\u2019s Signature', 'دولہا کے دستخط', '') +
      sline(y0 + 74, 'Bride\u2019s Signature', 'دلہن کے دستخط', '') +
      F(212, 1372, 600, 52,
        '<span>❖ May Allah Bless This Union ❖</span><span class="ur" lang="ur">اللہ اس رشتہ کو بابرکت بنائے</span>', 'nk-bless');
  }

  function render(d) {
    d = d || {};
    return '<div class="nk-paper"><div class="nk-static"></div><div class="nk-body">' +
      renderHeader() +
      renderTopInfo(d) +
      renderParty(607, 'Groom', 'دولہا', 'دولہے کا نام', 'groom', d) +
      renderParty(793, 'Bride', 'دلہن', 'دلہن کا نام', 'bride', d) +
      renderTrio(d) +
      renderMahr(d) +
      renderClosing(d) +
    '</div></div>';
  }

  // shrink any value box whose text overflows
  function fit(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.nk-fit'), function (el) {
      var fs = parseFloat(el.getAttribute('data-fs')) || 15, min = fs * 0.6, guard = 0;
      el.style.setProperty('--fs', fs);
      while (guard++ < 80 && fs > min &&
        (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
        fs = Math.round((fs - 0.25) * 100) / 100;
        el.style.setProperty('--fs', fs);
      }
    });
  }

  return { render: render, fit: fit };
})();
</script>
