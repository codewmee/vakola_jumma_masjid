<script>
/* NikahPaper.render(data) -> HTML string of the whole Nikah Nama.  NikahPaper.fit(root) -> shrink-to-fit pass.
   Every field below is positioned with left/top/width/height in % of the full
   1024x1536 paper — those numbers were read directly off the reference image
   (not eyeballed), so this lines up with it field-for-field. Re-measure and
   adjust the numbers in F(...) calls if the reference or the paper's aspect
   ratio ever changes. */
window.NikahPaper = (function () {
  'use strict';

  var MOSQUE_URL = {{ url_for('static', filename='nikha/mosque_top.png') | tojson }};

  var URDU_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
  var URDU_MONTHS = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  var URDU_DAYS = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];

  function txt(v) { return (v === null || v === undefined) ? '' : String(v); }
  function esc(v) {
    return txt(v).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function ud(v) { return txt(v).replace(/[0-9]/g, function (g) { return URDU_DIGITS.charAt(parseInt(g, 10)); }); }
  function parseDay(iso) {
    var s = txt(iso).trim(); if (!s) return null;
    var d = new Date(s.slice(0, 10) + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  function timeBoth(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(txt(t).trim());
    if (!m) return { en: '', ur: '' };
    var h = parseInt(m[1], 10), h12 = (h % 12 === 0) ? 12 : (h % 12);
    var part = h < 12 ? 'صبح' : (h < 17 ? 'دوپہر' : 'شام');
    return { en: h12 + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'), ur: ud(h12 + ':' + m[2]) + ' ' + part };
  }

  // absolutely-positioned field, in % of the paper. dataFs turns on the
  // shrink-to-fit pass (fit()) with that starting cqw size.
  function F(l, t, w, h, inner, cls, dataFs) {
    return '<div class="nk-f ' + (cls || '') + '"' + (dataFs ? ' data-fs="' + dataFs + '"' : '') +
      ' style="left:' + l + '%;top:' + t + '%;width:' + w + '%;height:' + h + '%">' + inner + '</div>';
  }
  function hline(t) { return F(3.91, t, 92.68, 0, '', 'nk-hline'); }
  function vline(l, t, h) { return F(l, t, 0, h, '', 'nk-vline'); }

  function label(l, t, w, h, en, ur) {
    return F(l, t, w, h, '<span>' + en + '</span><span class="ur" lang="ur">' + ur + '</span>', 'nk-lbl');
  }
  function vbox(l, t, w, h, inner, fs) {
    return F(l, t, w, h, inner, 'nk-vbox nk-fit', fs);
  }
  function bi(main, sub) {
    var m = txt(main).trim(), s = txt(sub).trim();
    return (m ? '<b>' + esc(m) + '</b>' : '') + (s ? '<span class="ur">' + esc(s) + '</span>' : '');
  }

  // ---------- header ----------
  function renderArch() {
    var d =
      'M45,428 L170,428 ' +
      'C195,428 195,390 195,320 ' +
      'C195,250 195,220 240,180 ' +
      'C290,150 340,120 400,100 ' +
      'C450,90 480,85 512,85 ' +
      'C544,85 574,90 624,100 ' +
      'C684,120 734,150 784,180 ' +
      'C829,220 829,250 829,320 ' +
      'C829,390 829,428 854,428 ' +
      'L979,428';
    return '' +
      '<div class="nk-f nk-arch">' +
        '<svg viewBox="0 0 1024 430" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="#b8862f" stroke-width="3.2"/></svg>' +
        '<img class="mosque" src="' + MOSQUE_URL + '" alt="">' +
        '<div class="bism" lang="ur">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' +
        '<div class="verse l">' +
          '<span class="ar" lang="ar">وَخَلَقْنَاكُمْ أَزْوَاجًا</span>' +
          '<span class="ref">(القرآن ٧٨:٨)</span>' +
        '</div>' +
        '<div class="verse r">' +
          '<span class="ar" lang="ar">لِّتَسْكُنُوٓا۟ إِلَيْهَا</span>' +
          '<span class="ref">(القرآن ٣٠:٢١)</span>' +
        '</div>' +
        '<div class="t-ur" lang="ur">نکاح نامہ</div>' +
        '<div class="t-en">NIKAH NAMA</div>' +
        '<div class="divider">❖ &nbsp; ❖ &nbsp; ❖</div>' +
        '<div class="sub-ur" lang="ur">عقد نکاح</div>' +
        '<div class="sub-en">Marriage Contract</div>' +
      '</div>';
  }

  // ---------- top info: date / location / serial ----------
  function renderTopInfo(d) {
    var dt = parseDay(d.nikah_date);
    var numDate = dt ? pad2(dt.getDate()) + '/' + pad2(dt.getMonth() + 1) + '/' + dt.getFullYear() : '';
    var enDay = dt ? dt.toLocaleDateString('en-US', { weekday: 'long' }) : '';
    var tm = timeBoth(d.nikah_time);
    var serial = [d.jild_no ? ('Vol. ' + txt(d.jild_no)) : '', d.sanad_no ? ('No. ' + txt(d.sanad_no)) : '']
      .filter(Boolean).join('  /  ');

    return '' +
      label(3.91, 27.86, 30.76, 1.82, 'Nikah Date', 'تاریخ نکاح') +
      vbox(3.91, 29.95, 30.76, 2.73, bi(numDate, [enDay, tm.en].filter(Boolean).join(' · ')), 1.15) +
      label(37.60, 27.86, 32.23, 1.82, 'Nikah Location', 'نکاح کی جگہ') +
      vbox(37.60, 29.95, 32.23, 2.73, bi(d.nikah_location, d.nikah_location_ur), 1.15) +
      label(72.75, 27.86, 20.51, 1.82, 'Serial No.', 'سلسلہ نمبر') +
      vbox(72.75, 29.95, 20.51, 2.73, bi(serial), 1.15) +
      vline(35.64, 27.34, 5.54) + vline(71.29, 27.34, 5.54) +
      hline(32.88);
  }

  // ---------- groom / bride party ----------
  function renderParty(topBase, enLabel, urLabel, name, nameUr, age, addr, addrUr, dividerAfter) {
    var t = topBase;
    return '' +
      F(4.39, t, 17.09, 11.39, '<div class="nk-medal"><span class="en">' + enLabel + '</span><span class="ur" lang="ur">' + urLabel + '</span></div>') +
      label(22.46, t + 0.32, 70.80, 1.30, 'Full Name of ' + enLabel, 'نام') +
      vbox(22.46, t + 1.82, 70.80, 2.28, bi(name, nameUr), 1.3) +
      label(22.46, t + 4.56, 13.67, 1.43, 'Age', 'عمر') +
      vbox(22.46, t + 6.18, 13.67, 2.47, bi(age, age ? 'عمر ' + ud(age) : ''), 1.15) +
      label(38.09, t + 4.56, 55.18, 1.43, 'Address', 'پتہ') +
      vbox(38.09, t + 6.18, 55.18, 2.47, bi(addr, addrUr), 1.1) +
      label(22.46, t + 9.11, 70.80, 1.43, "Father's Name", 'باپ کا نام') +
      vbox(22.46, t + 10.74, 70.80, 2.47, '', 1.15) +
      hline(dividerAfter);
  }

  // ---------- vakil / witness trio ----------
  function renderTrio(d) {
    function card(l, w, enLabel, urLabel, name, nameUr, age, addr, addrUr) {
      return '' +
        F(l, 64.65, w, 1.82, '<div class="nk-chead"><span>' + enLabel + '</span><span class="ur" lang="ur">' + urLabel + '</span></div>') +
        label(l, 67.71, w, 1.43, 'Full Name', 'نام') +
        vbox(l, 69.34, w, 2.47, bi(name, nameUr), 1.1) +
        label(l, 72.27, w, 1.43, 'Age', 'عمر') +
        vbox(l, 73.89, w, 2.47, bi(age, age ? ud(age) : ''), 1.1) +
        label(l, 76.69, w, 1.30, 'Address', 'پتہ') +
        vbox(l, 78.12, w, 2.08, bi(addr, addrUr), 1.0);
    }
    return '' +
      card(3.91, 29.79, 'Vakil', 'وکیل', d.vakil_name, d.vakil_name_ur, d.vakil_age, d.vakil_address, d.vakil_address_ur) +
      card(35.64, 29.79, 'Witness 1', 'گواہ اول', d.witness1_name, d.witness1_name_ur, d.witness1_age, d.witness1_address, d.witness1_address_ur) +
      card(67.38, 28.81, 'Witness 2', 'گواہ دوم', d.witness2_name, d.witness2_name_ur, d.witness2_age, d.witness2_address, d.witness2_address_ur) +
      vline(34.67, 64.65, 16.28) + vline(66.41, 64.65, 16.28) +
      hline(80.40);
  }

  // ---------- mahr row ----------
  function renderMahr(d) {
    var rawAmt = txt(d.maher_amount).trim();
    var n = Number(rawAmt.replace(/,/g, ''));
    var amount = rawAmt === '' ? '' : (isFinite(n) ? n.toLocaleString('en-IN') : rawAmt);
    var promptOn = d.dower_type !== 'deferred';
    function ck(on) { return '<span class="nk-ck' + (on ? ' on' : '') + '" style="width:1.4cqw;height:1.4cqw;"></span>'; }
    function opt(l, w, on, en, ur) {
      return F(l, 81.38, w, 1.63, '<span class="nk-ckopt" style="position:static;">' + ck(on) + en + ' <span class="ur" lang="ur">' + ur + '</span></span>');
    }
    return '' +
      label(4.39, 81.05, 30.27, 1.69, 'Amount of Mahr', 'مہر کی رقم') +
      vbox(4.39, 83.01, 30.27, 2.73, '<span style="font-weight:700;">' + (amount ? '₹ ' + esc(amount) : '') + '</span>', 1.4) +
      opt(37.11, 17.6, !promptOn, 'Deferred Dower', 'مؤخر مہر') +
      opt(57.13, 17.1, promptOn, 'Prompt Dower', 'فوری مہر') +
      F(76.66, 81.38, 19.4, 1.4, '<span style="font-size:.95cqw;font-weight:600;color:#4a3d1c;">Mahr Paid <span class="ur" lang="ur">مہر ادا کردی گئی</span></span>') +
      opt(76.66, 9, false, 'Yes', 'ہاں') +
      F(86.91, 83.33, 9.5, 1.3, '<span class="nk-ckopt" style="position:static;">' + ck(false) + 'No <span class="ur" lang="ur">نہیں</span></span>') +
      vline(35.64, 80.40, 5.80) +
      hline(86.20);
  }

  // ---------- stamp / qazi / signatures ----------
  function renderClosing(d) {
    function sline(t, en, ur, val) {
      return F(36.62, t, 59.57, 2.0,
        '<div style="display:flex;align-items:baseline;gap:1cqw;height:100%;">' +
          '<span style="flex:none;font-size:1.05cqw;font-weight:600;color:#4a3d1c;">' + en + ' <span class="ur" lang="ur">' + ur + '</span></span>' +
          '<span class="nk-sig" style="flex:1;">' + (val ? esc(val) : '') + '</span>' +
        '</div>');
    }
    var qaziName = [d.qazi_name, d.qazi_name_ur].filter(Boolean).join('  ');
    return '' +
      label(4.39, 87.24, 24.41, 0.91, 'Stamp', 'مہر') +
      F(4.39, 88.22, 24.41, 7.16, '', 'nk-stamp') +
      vline(35.64, 87.24, 8.46) +
      sline(87.70, 'Qazi / Nikah Registrar', 'قاضی / نکاح رجسٹرار', qaziName) +
      sline(90.70, "Groom\u2019s Signature", 'دولہا کے دستخط', '') +
      sline(93.60, "Bride\u2019s Signature", 'دلہن کے دستخط', '') +
      hline(95.70);
  }

  function render(d) {
    d = d || {};
    return '<div class="nk-paper"><div class="nk-static"></div><div class="nk-body">' +
      renderArch() +
      renderTopInfo(d) +
      renderParty(33.53, 'Groom', 'دولہا', d.groom_name, d.groom_name_ur, d.groom_age, d.groom_address, d.groom_address_ur, 46.88) +
      renderParty(47.85, 'Bride', 'دلہن', d.bride_name, d.bride_name_ur, d.bride_age, d.bride_address, d.bride_address_ur, 60.88) +
      renderTrio(d) +
      renderMahr(d) +
      renderClosing(d) +
      '<div class="nk-blessing">❖ May Allah Bless This Union ❖<span class="ur" lang="ur">اللہ اس رشتہ کو بابرکت بنائے</span></div>' +
    '</div></div>';
  }

  // shrink any box whose text does not fit, in small steps
  function fit(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.nk-fit'), function (el) {
      var fs = parseFloat(el.getAttribute('data-fs')) || 1.5, min = fs * 0.55, guard = 0;
      el.style.setProperty('--fs', fs);
      while (guard++ < 60 && fs > min &&
        (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) {
        fs = Math.round((fs - 0.05) * 100) / 100;
        el.style.setProperty('--fs', fs);
      }
    });
  }

  return { render: render, fit: fit };
})();
</script>
